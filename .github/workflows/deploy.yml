name: Deploy LeaveDesk backend to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION:    us-east-1

    steps:

      # ── Step 1: Get the code ──────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v3

      # ── Step 2: Build Lambda deployment package ───────────
      # archive_file.lambda_zip evaluates at plan time, so the
      # package must exist before terraform init.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Lambda package
        run: |
          pip install -r backend/requirements.txt -t backend/package \
            --upgrade --no-user \
            --platform manylinux2014_x86_64 --only-binary=:all: \
            --python-version 3.11
          mkdir -p backend/package
          cp backend/handler.py backend/package/handler.py

      # ── Step 3: Terraform ─────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Create terraform.tfvars
        run: |
          cat > terraform/terraform.tfvars << EOF
          admin_password = "${{ secrets.ADMIN_PASSWORD }}"
          alert_email    = "${{ secrets.ALERT_EMAIL }}"
          admin_email    = "${{ secrets.ADMIN_EMAIL }}"
          EOF

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
