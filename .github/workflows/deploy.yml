name: Deploy LeaveDesk to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION:    us-east-1

    steps:

      # ── Step 1: Get the code ──────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v3

      # ── Step 2: Install Terraform ─────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      # ── Step 3: Create empty credentials file ─────────────
      # Terraform needs the file to exist even if empty
      # because main.tf references it
      # Real auth comes from AWS_* env vars above
      - name: Create credentials file
        run: |
          mkdir -p /home/runner/work/leave-request-app/leave-request-app
          touch /home/runner/work/leave-request-app/leave-request-app/credentials

      # ── Step 4: Create terraform.tfvars ───────────────────
      - name: Create terraform.tfvars
        run: |
          cat > terraform/terraform.tfvars << EOF
          admin_password = "${{ secrets.ADMIN_PASSWORD }}"
          password_salt  = "${{ secrets.PASSWORD_SALT }}"
          alert_email    = "${{ secrets.ALERT_EMAIL }}"
          EOF

      # ── Step 5: Terraform Init ─────────────────────────────
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # ── Step 6: Terraform Plan ─────────────────────────────
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      # ── Step 7: Terraform Apply ────────────────────────────
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
