<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Management — Admin Dashboard</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body class="login-body" style="align-items:flex-start; padding: 32px 24px;">

<div class="dashboard-card">

  <div class="dash-header">
    <h2>Admin Dashboard</h2>
    <div class="dash-user">
      <span>Administrator</span>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="card total">
      <h3>Total</h3>
      <p id="totalRequests">0</p>
    </div>
    <div class="card pending">
      <h3>Pending</h3>
      <p id="pendingRequests">0</p>
    </div>
    <div class="card approved">
      <h3>Approved</h3>
      <p id="approvedRequests">0</p>
    </div>
    <div class="card rejected">
      <h3>Rejected</h3>
      <p id="rejectedRequests">0</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <select id="statusFilter">
      <option value="All">All Statuses</option>
      <option value="Pending">Pending</option>
      <option value="Approved">Approved</option>
      <option value="Rejected">Rejected</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search by employee name or email...">
    <button onclick="applyFilters()">Apply</button>
  </div>

  <!-- Requests -->
  <div id="requestsContainer">
    <div class="empty-state">
      <span class="empty-icon">📋</span>
      <p>Loading requests...</p>
    </div>
  </div>

</div>

<div id="loader" class="loader hidden"></div>
<script src="js/admin.js"></script>
</body>
</html>
