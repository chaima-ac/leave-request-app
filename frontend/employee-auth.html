<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Management — Employee</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body class="login-body">

<div class="auth-card">
  <div class="brand">
    <div class="brand-icon">🗓️</div>
    <span class="brand-name">LeaveDesk</span>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
    <button class="tab" id="tabRegister" onclick="switchTab('register')">Create Account</button>
  </div>

  <!-- LOGIN -->
  <div id="loginSection">
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your employee account</p>

    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="loginEmail" placeholder="you@company.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password">
    </div>
    <button class="btn-auth" onclick="doLogin()">Sign In →</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- REGISTER -->
  <div id="registerSection" style="display:none">
    <h2>Create account</h2>
    <p class="subtitle">Set up your employee profile</p>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="regName" placeholder="Your full name" autocomplete="name">
    </div>
    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="regEmail" placeholder="you@company.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPassword" placeholder="Minimum 6 characters">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="regConfirm" placeholder="Repeat your password">
    </div>
    <button class="btn-auth" onclick="doRegister()">Create Account →</button>
    <div class="msg" id="registerMsg"></div>
  </div>

  <div class="back-link">
    <a href="index.html">← Back to role selection</a>
  </div>
</div>

<div id="loader" class="loader hidden"></div>
<script src="js/employee-auth.js"></script>
</body>
</html>
