<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Management — Admin</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body class="login-body">

<div class="auth-card">
  <div class="brand">
    <div class="brand-icon">🛡️</div>
    <span class="brand-name">LeaveDesk Admin</span>
  </div>

  <h2>Admin Sign In</h2>
  <p class="subtitle">Enter your admin password to access the dashboard</p>

  <div class="form-group">
    <label>Admin Password</label>
    <input type="password" id="adminPassword" placeholder="Enter admin password"
           onkeydown="if(event.key==='Enter') doAdminLogin()">
  </div>

  <button class="btn-auth" onclick="doAdminLogin()">Sign In →</button>
  <div class="msg" id="adminMsg"></div>

  <div class="back-link">
    <a href="index.html">← Back to role selection</a>
  </div>
</div>

<div id="loader" class="loader hidden"></div>
<script src="js/admin-auth.js"></script>
</body>
</html>
